# =============================================
# FINANCE SYSTEM - APPLICATION CONFIGURATION
# =============================================

spring.application.name=finance-system
server.port=8080
server.servlet.context-path=/

# =============================================
# POSTGRESQL CONFIGURATION
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / HIBERNATE CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =============================================
# REDIS CONFIGURATION
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache TTL (seconds)
app.cache.dashboard.ttl=300

# =============================================
# JWT CONFIGURATION
# =============================================
app.jwt.secret=4f7c3a9e2b1d8f6a5c0e9b3d7a4f1c8e2b5d9a6f3c0e7b4a1d8f5c2e9b6d3a0f7c4a1e8b5d2c9f6a3e0b7d4f1c8a5e2b9d6f3a0c7e4b1f8d5c2a9e6b3d0f7a4c1e8b
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# =============================================
# SWAGGER / OPENAPI CONFIGURATION
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =============================================
# LOGGING
# =============================================
logging.level.root=INFO
logging.level.com.finance=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
